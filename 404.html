<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost ★ Dylan Dyal</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0e18" />
  <link rel="icon" type="image/png" sizes="32x32" href="/y2k-site/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sassy+Frass&family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000;
      --text: #fff;
      --soft: #e7d9ff;
      --glow: 0 0 16px #6a3a88, 0 10px 28px rgba(0, 0, 0, 0.9);
    }

    body.light-mode {
      --bg: #fff;
      --text: #0f172a;
      --soft: #5b2a86;
      --glow: 0 0 10px #d946ef, 0 0 20px #0284c7;
    }

    html, body { height: 100%; }

    body {
      background: radial-gradient(circle at 50% 45%, #2a1840 0, var(--bg) 60%);
      color: var(--text);
      font-family: 'Silkscreen', monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body.light-mode { background: radial-gradient(circle at 50% 45%, #f1e6ff 0, var(--bg) 60%); }

    .ticker {
      background: #160e22;
      color: #e7d9ff;
      border-bottom: 2px solid #c9b6ff;
      font-size: 0.75rem;
      padding: 4px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker span {
      display: inline-block;
      padding-left: 100%;
      animation: ticker 18s linear infinite;
    }

    @keyframes ticker { to { transform: translateX(-100%); } }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 16px;
      text-align: center;
    }

    .reaper {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 8px rgba(120, 36, 186, 0.85)) drop-shadow(0 8px 12px rgba(110, 12, 32, 0.45));
      animation: float 3.8s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-10px) rotate(1.4deg); }
    }

    .bubble {
      background: linear-gradient(#fffef2, #ffe56a);
      border: 2px solid #140c22;
      box-shadow: 3px 3px 0 #c9b6ff;
      border-radius: 10px;
      padding: 7px 12px 8px;
      font-size: 10px;
      color: #1a1028;
    }

    h1 {
      font-family: 'Sassy Frass', cursive;
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 5rem);
      line-height: 1;
      text-shadow: var(--glow);
    }

    p {
      color: var(--soft);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      max-width: 34ch;
      line-height: 1.7;
    }

    a.home {
      margin-top: 6px;
      background: #160e22;
      color: #e7d9ff;
      border: 2px outset #c9b6ff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.7rem;
      text-decoration: none;
    }

    a.home:hover { background: #2a1840; color: #fff; }

    a.home:focus-visible {
      outline: 2px solid #01cdfe;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker span, .reaper { animation: none; }
    }
  </style>
</head>
<body>
  <div class="ticker" aria-hidden="true"><span>★ 404 ★ YOU HAVE WANDERED OFF THE REALM ★ NOTHING LIVES HERE ★</span></div>
  <main>
    <div class="bubble">Not here.</div>
    <img class="reaper" src="/y2k-site/ghost.png" alt="" width="120" height="149">
    <h1>Lost</h1>
    <p>This page has passed on. The reaper looked everywhere.</p>
    <a class="home" href="/y2k-site/">Back to the realm</a>
  </main>
  <script>
    try {
      if (localStorage.getItem('y2k-theme') === 'light') document.body.classList.add('light-mode');
    } catch (err) {}
  </script>
</body>
</html>
