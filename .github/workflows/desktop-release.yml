name: Desktop release

# Builds the Reaper desktop app on macOS, Windows and Linux.
# Pushing a tag like reaper-v0.2.0 publishes the installers as a GitHub release;
# running it by hand ("Run workflow") only builds them, as downloadable artifacts.
on:
  push:
    tags: ['reaper-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # llama-server, which runs the free mind's model: both builds on the Mac
      # runner, which makes the arm64 and x64 installers.
      - run: node tools/fetch-llama-server.mjs ${{ matrix.os == 'macos-latest' && '--mac' || '' }}
      # Unsigned builds: no certificates are configured.
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: reaper-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/reaper-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Reaper ${{ github.ref_name }}
          body: |
            The reaper, loose on your desktop. Download the file for your computer:

            - **macOS:** `Reaper-…-mac-arm64.dmg` (Apple silicon) or `Reaper-…-mac-x64.dmg` (Intel)
            - **Windows:** `Reaper-…-win-x64.exe`
            - **Linux:** `Reaper-…-linux-x86_64.AppImage`

            These builds aren't code-signed. On macOS, right-click the app and choose Open the first time. On Windows, choose More info, then Run anyway.
          files: installers/*
