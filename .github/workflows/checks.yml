name: Checks

# Lint and browser smoke tests on every push and pull request.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop

  # The desktop companion: its conversation loop against a fake API, then the
  # real Electron app under a virtual display.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: node tests/oracle.mjs
        working-directory: desktop
      - run: node tests/minds.mjs
        working-directory: desktop
      - run: node tests/crypt.mjs
        working-directory: desktop
      - run: xvfb-run -a node tests/launch.mjs
        working-directory: desktop
      # Roaming between monitors, on a pretend portrait-landscape-portrait desktop.
      # Xvfb shows Electron only one monitor, so this uses X.org's dummy driver.
      - name: Roaming between monitors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils
          printf 'allowed_users=anybody\nneeds_root_rights=no\n' | sudo tee /etc/X11/Xwrapper.config
          tests/plp-desktop.sh node tests/roam.mjs
        working-directory: desktop
